[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xtheta-lab"
version = "0.1.0"
description = "X-Theta V2 computational phenomenology research stack"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["xtheta*"]
